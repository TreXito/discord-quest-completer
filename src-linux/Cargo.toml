[package]
name = "src-linux"
version = "0.2.0"
edition = "2021"
description = "Minimal Linux dummy game runner for Discord Quest Completer"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "src-linux"
path = "src/main.rs"

# Tiny binary on purpose: it gets copied once per fake game.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
incremental = false
